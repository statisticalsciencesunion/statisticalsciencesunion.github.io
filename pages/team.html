<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The 2026-2027 executive team of the Statistical Sciences Union at UofT." />
  <title>Team · SSU</title>


  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,500;9..144,400..500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />


  <style>
    /* Hover-to-reveal bio on member portraits */
    .member__portrait-wrap {
      position: relative;
      overflow: hidden;
      border-radius: inherit;
      cursor: default;
    }

    .member__portrait-wrap .member__portrait,
    .member__portrait-wrap .member__portrait--placeholder,
    .member__portrait-wrap .member__portrait--empty {
      margin: 0;
    }

    .member__hover-bio {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      background: rgba(20, 20, 20, 0.86);
      color: #fff;
      font-family: "Inter", sans-serif;
      font-size: 0.9rem;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }


    .member__portrait-wrap:hover .member__hover-bio,
    .member__portrait-wrap:focus-within .member__hover-bio {
      opacity: 1;
      transform: translateY(0);
    }


    .member__portrait-wrap:focus {
      outline: 2px solid rgba(255, 255, 255, 0.6);
      outline-offset: 2px;
    }
  </style>
</head>


<body>


  <div id="masthead"></div>


  <main>


    <section class="page-header">
      <div class="container">
        <p class="eyebrow">&sect; 02 &mdash; The team</p>


        <h1 class="display">
          Meet the people behind the union.
        </h1>


        <p class="lede">
          We're a team of undergraduates, coming from statistics, math, computer science, and the life sciences.
        </p>
      </div>
    </section>


    <section class="article">
      <div class="container">


        <h2 class="section-title" style="margin-bottom:32px;">
          Executive, 2026&ndash;2027
        </h2>


        <!-- Populated automatically by team.js -->
        <div id="teamGrid" class="team-grid team-grid--large"></div>


      </div>
    </section>
   
    <section class="cta-section">
      <div class="container cta-section__inner">
        <h2 class="section-title">Want to join the team?</h2>


        <p class="lede">
          We open executive applications in August and welcome general members
          year-round.
        </p>


        <a href="../index.html#join" class="btn btn--primary">
          Get in touch
        </a>
      </div>
    </section>


  </main>


  <div id="footer"></div>


  <script src="../assets/js/header_footer.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/team.js"></script>

</body>
</html>
